{# active_nav: home | board | favorites | notes | about | privacy（その他は未選択） #}
{% set nav = active_nav|default('') %}
<header class="site-header">
  <div class="site-header__inner">
    <a href="/" class="site-header__brand{% if nav == 'home' %} is-active{% endif %}">
      <span class="site-header__brand-mark" aria-hidden="true">⚽</span>
      <span class="site-header__brand-text">
        <span class="site-header__title">サッカートレーニング検索</span>
        <span class="site-header__beta" aria-label="ベータ版">Beta</span>
      </span>
    </a>
    <button type="button" class="site-header__menu-btn" id="site-header-menu-btn" aria-expanded="false" aria-controls="site-header-nav" aria-label="メニューを開く">
      <span class="site-header__menu-icon" aria-hidden="true"></span>
    </button>
    <nav class="site-header__nav" id="site-header-nav" aria-label="メインナビゲーション">
      <ul class="site-header__list">
        <li>
          <a href="/" class="site-header__link{% if nav == 'home' %} is-active{% endif %}"{% if nav == 'home' %} aria-current="page"{% endif %}>ホーム</a>
        </li>
        <li>
          <a href="/board" class="site-header__link{% if nav == 'board' %} is-active{% endif %}"{% if nav == 'board' %} aria-current="page"{% endif %}>ボード</a>
        </li>
        <li>
          <a href="/favorites" class="site-header__link nav-with-badge{% if nav == 'favorites' %} is-active{% endif %}"{% if nav == 'favorites' %} aria-current="page"{% endif %}>お気に入り<span id="favorites-badge" class="nav-badge" aria-label="お気に入りの動画数" style="display:none;"></span></a>
        </li>
        <li>
          <a href="/practice-notes" id="practice-notes-link" class="site-header__link nav-with-badge{% if nav == 'notes' %} is-active{% endif %}"{% if nav == 'notes' %} aria-current="page"{% endif %}>メモ帳<span id="practice-notes-badge" class="nav-badge" aria-label="選んだメニュー数" style="display:none;"></span></a>
        </li>
        <li>
          <a href="/account" class="site-header__link">アカウント</a>
        </li>
        <li>
          <a href="/about" class="site-header__link{% if nav == 'about' %} is-active{% endif %}"{% if nav == 'about' %} aria-current="page"{% endif %}>このサイトについて</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
