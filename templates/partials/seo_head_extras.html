{# seo_canonical_path: "/" | "/about" | "/board" | "/privacy" #}
{% set _seo_path = seo_canonical_path|default('/') %}
<link rel="alternate" hreflang="ja" href="{{ build_seo_page_url(_seo_path, 'ja') }}">
<link rel="alternate" hreflang="en" href="{{ build_seo_page_url(_seo_path, 'en') }}">
<link rel="alternate" hreflang="x-default" href="{{ build_seo_page_url(_seo_path, 'ja') }}">
{% if ui_locale == 'ja' %}
<meta property="og:locale:alternate" content="en_US">
{% else %}
<meta property="og:locale:alternate" content="ja_JP">
{% endif %}
